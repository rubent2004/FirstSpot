services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: geo-prioridad-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geo_prioridad
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geo_prioridad"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
