[project]
name = "geo-prioridad-backend"
version = "0.1.0"
description = "Geospatial prioritization backend for vulnerable population attention"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.15.2",
    "shapely>=2.0.6",
    "alembic>=1.13.3",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "pwdlib[argon2]>=0.2.1",
    "PyJWT>=2.10.1",
    "email-validator>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
